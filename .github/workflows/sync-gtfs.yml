name: Sync official Rīgas satiksme GTFS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: write

concurrency:
  group: sync-official-gtfs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test importer
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Download and import latest official GTFS
        run: python3 scripts/import_gtfs.py --latest
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Commit updated feed
        run: |
          if git diff --quiet -- src/data/gtfs-data.ts public/data/gtfs; then
            echo "Official GTFS feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/gtfs-data.ts public/data/gtfs
          git commit -m "data: sync official Rīgas satiksme GTFS"
          git push origin HEAD:main
